# 00-baseline config
# All ablations should change ONLY the architectural component being tested.
# Training schedule, data, eval — must stay identical for fair comparison.

experiment:
  name: "00-baseline"
  description: "Vanilla decoder-only transformer (frozen reference)"

data:
  dataset: "shakespeare"        # 첫 sanity run: shakespeare(1MB, 빠름). 본격 비교는 tinystories로.
  vocab_size: 1024              # shakespeare용 (어휘 작음). tinystories면 4096 권장.
  max_train_samples: null
  max_eval_samples: 200

model:
  max_seq_len: 256              # shakespeare chunk가 짧음. tinystories면 512.
  d_model: 256
  n_layers: 4
  n_heads: 4
  ffn_hidden: 1024              # 4× d_model
  dropout: 0.1

train:
  batch_size: 32
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 100
  max_steps: 1500
  eval_interval: 200
  log_interval: 50
  grad_clip: 1.0
  device: "auto"
  seed: 42
  use_amp: true                 # CUDA에서만 적용

generation:
  prompts:
    - "ROMEO:"
    - "To be, or not to be,"
    - "What is "
  max_new_tokens: 80
  temperature: 0.8
  top_k: 50

extrapolation:
  # PE ablation의 핵심 metric — 학습 길이를 넘는 시퀀스에서 PPL
  enabled: false                # baseline은 외삽 자체가 안 됨 (max_seq_len 제한). RoPE 실험에서 enable.
  seq_lens: [256, 512, 1024, 2048]
