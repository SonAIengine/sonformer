# 02a-rope config
# Compared to 00-baseline, the only training-pipeline change is enabling
# extrapolation evaluation (which baseline cannot run — learned PE breaks).

experiment:
  name: "02a-rope"
  description: "Replace learned PE with RoPE (split-half rotation, LLaMA convention)"

data:
  dataset: "shakespeare"
  vocab_size: 1024
  max_train_samples: null
  max_eval_samples: 200

model:
  max_seq_len: 256
  d_model: 256
  n_layers: 4
  n_heads: 4
  ffn_hidden: 1024
  dropout: 0.1
  rope_base: 10000.0
  rope_cache_len: 4096          # 16× max_seq_len 정도로 — 외삽 평가에 사용

train:
  batch_size: 32
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 100
  max_steps: 1500
  eval_interval: 200
  log_interval: 50
  grad_clip: 1.0
  device: "auto"
  seed: 42
  use_amp: true

generation:
  prompts:
    - "ROMEO:"
    - "To be, or not to be,"
    - "What is "
  max_new_tokens: 80
  temperature: 0.8
  top_k: 50

extrapolation:
  enabled: true                 # ← RoPE의 핵심 장점 검증
  seq_lens: [128, 256, 512, 1024, 2048]
