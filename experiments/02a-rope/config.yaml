# 02a-rope config
# Compared to 00-baseline, the only training-pipeline change is enabling
# extrapolation evaluation (which baseline cannot run — learned PE breaks).

experiment:
  name: "02a-rope"
  description: "Replace learned PE with RoPE (split-half rotation, LLaMA convention)"

data:
  dataset: "tinystories"
  vocab_size: 4096
  max_train_samples: null
  max_eval_samples: 2000

model:
  max_seq_len: 512
  d_model: 384
  n_layers: 6
  n_heads: 6
  ffn_hidden: 1536
  dropout: 0.1
  rope_base: 10000.0
  rope_cache_len: 8192          # pre-computed cos/sin length (covers 16× max_seq_len)

train:
  batch_size: 32
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 200
  max_steps: 5000
  eval_interval: 500
  log_interval: 50
  grad_clip: 1.0
  device: "auto"
  seed: 42
  use_amp: true

generation:
  prompts:
    - "Once upon a time"
    - "The little girl"
    - "In a faraway"
  max_new_tokens: 64
  temperature: 0.7
  top_k: 50

extrapolation:
  enabled: true                 # ← RoPE의 핵심 장점 검증
  seq_lens: [256, 512, 1024, 2048]
